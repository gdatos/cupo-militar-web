<svg viewBox="0 0 640 200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .ink{fill:#20242b;}
      .brass{fill:#a9793f;}
      .word{font-family:'Iowan Old Style','Palatino Linotype',Georgia,serif;}
    </style>
  </defs>

  <!-- ====== ICONO ======
       Círculo partido: el arco grueso en latón representa el "cupo"
       reservado dentro del total (40%, como el de Guardia Civil) —
       la métrica central del producto convertida en marca, no un
       escudo o águila genéricos. -->
  <g transform="translate(100,100)">
    <circle r="72" fill="none" stroke="#c7cbd0" stroke-width="10"/>
    <!-- arco de "cupo" — 40% del círculo, empezando arriba -->
    <path d="M 0,-72 A 72,72 0 0 1 68.4,-22.2"
          fill="none" stroke="#a9793f" stroke-width="14" stroke-linecap="round"/>
    <!-- galón central, mismo motivo que el resto de la identidad -->
    <path d="M -22,14 L 0,-10 L 22,14" fill="none" stroke="#20242b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ====== WORDMARK ====== -->
  <text x="210" y="93" class="word ink" font-size="54" font-weight="600" letter-spacing="0.5">Cupo</text>
  <text x="210" y="150" class="word brass" font-size="54" font-weight="600" letter-spacing="0.5">Militar</text>
</svg>
